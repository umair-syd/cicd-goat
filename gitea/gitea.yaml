orgs:
    Wonderland:
        teams:
            Maintainers:
                permission: write
                members:
                    # SECURITY FIX: Removed jenkins_caterpillar from Maintainers team
                    # CI identities must not have write access to repositories that Jenkins executes
        repos:
            white-rabbit:
                private: true
                code: repositories/white-rabbit
                collaborators:
                    thealice: write
                    jenkins: read
                branch_protections:
                    main:
                        required_approvals: 2
            caterpillar:
                private: false
                code: repositories/caterpillar
                # SECURITY FIX: Grant jenkins_caterpillar read-only access instead of write via team
                collaborators:
                    jenkins_caterpillar: read
                # SECURITY FIX: Add branch protection to prevent CI identity from pushing malicious code
                branch_protections:
                    main:
                        required_approvals: 1
            mad-hatter:
                private: true
                code: repositories/mad-hatter
                collaborators:
                    thealice: write
                    jenkins: read
            mad-hatter-pipeline:
                private: true
                code: repositories/mad-hatter-pipeline
                collaborators:
                    jenkins_hatter: read
                    thealice: read
                branch_protections:
                    main:
                        required_approvals: 2
            duchess:
                private: false
                code: repositories/duchess
            cheshire-cat:
                private: true
                code: repositories/cheshire-cat
                collaborators:
                    thealice: write
                    jenkins: read
                branch_protections:
                    main:
                        required_approvals: 2
            dodo:
                private: false
                code: repositories/dodo
                collaborators:
                    thealice: write
            twiddledee:
                private: false
                code: repositories/twiddledee
                collaborators:
                    thealice: write
                releases:
                    1.1.0:
                        tag_name: 1.1.0
            twiddledum:
                private: false
                code: repositories/twiddledum
            dormouse:
                private: false
                code: repositories/dormouse
            mock-turtle:
                code: repositories/mock-turtle
                private: true
                collaborators:
                    # SECURITY FIX: Changed mock-turtle-ci from write to read access
                    # CI identities must not have write access to repositories that Jenkins executes
                    mock-turtle-ci: read
                    jenkins: read
                    thealice: write
                branch_protections:
                    main:
                        # SECURITY FIX: Removed mock-turtle-ci from merge whitelist
                        # CI identities must not be able to merge code that they will execute
                        merge_whitelist_usernames: []
                        enable_merge_whitelist: false
                        required_approvals: 1
    Cov:
        repos:
            reportcov:
                private: false
                code: repositories/reportcov
                webhooks:
                    http://jenkins-server:8080/generic-webhook-trigger/invoke?token=6AE44837-0E0C-4970-9A40-8C780E6FFBA1:
                        events:
                            - push
                            - pull_request
                        branch_filter: main
                    
            